<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradClean" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#faf5ec"/>
      <stop offset="100%" stop-color="#efe2cc"/>
    </radialGradient>
    <linearGradient id="wheatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb775"/>
      <stop offset="50%" stop-color="#b8863b"/>
      <stop offset="100%" stop-color="#8a5b23"/>
    </linearGradient>
    <linearGradient id="breadBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#df9a4e"/>
      <stop offset="45%" stop-color="#bd6d23"/>
      <stop offset="85%" stop-color="#824311"/>
      <stop offset="100%" stop-color="#542807"/>
    </linearGradient>
    <linearGradient id="crustCutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#fad089"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#734a26" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fundo Circular Clean em Tons de Trigo Suave -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradClean)"/>
  
  <!-- Moldura Fina Nobre em Trigo Dourado -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#wheatGrad)" stroke-width="3" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#wheatGrad)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="8 6"/>

  <!-- Halo de Luz Suave -->
  <circle cx="256" cy="235" r="150" fill="#dfb775" opacity="0.14"/>

  <!-- Espiga de Trigo Esquerda -->
  <g transform="translate(138, 185) rotate(-28)" fill="url(#wheatGrad)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="9" ry="22"/>
    <ellipse cx="-10" cy="25" rx="8" ry="18"/>
    <ellipse cx="10" cy="25" rx="8" ry="18"/>
    <ellipse cx="-12" cy="52" rx="7" ry="16"/>
    <ellipse cx="12" cy="52" rx="7" ry="16"/>
    <path d="M0,0 Q-5,60 0,95" stroke="url(#wheatGrad)" stroke-width="3" fill="none"/>
  </g>

  <!-- Espiga de Trigo Direita -->
  <g transform="translate(374, 185) rotate(28)" fill="url(#wheatGrad)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="9" ry="22"/>
    <ellipse cx="-10" cy="25" rx="8" ry="18"/>
    <ellipse cx="10" cy="25" rx="8" ry="18"/>
    <ellipse cx="-12" cy="52" rx="7" ry="16"/>
    <ellipse cx="12" cy="52" rx="7" ry="16"/>
    <path d="M0,0 Q5,60 0,95" stroke="url(#wheatGrad)" stroke-width="3" fill="none"/>
  </g>

  <!-- Pão Rústico Artesanal Redondo (Boule Sagrado) com Sombra Suave -->
  <ellipse cx="256" cy="318" rx="142" ry="30" fill="#4a280d" opacity="0.16"/>

  <!-- Corpo do Pão -->
  <path d="M 125,295 C 120,208 185,160 256,160 C 327,160 392,208 387,295 C 385,325 330,335 256,335 C 182,335 127,325 125,295 Z" fill="url(#breadBodyGrad)" filter="url(#softShadow)"/>

  <!-- Cortes Tradicionais na Casca do Pão (Em Cruz e Pétalas de Trigo) -->
  <g stroke="url(#crustCutGrad)" stroke-width="8" stroke-linecap="round" opacity="0.95">
    <path d="M 256,175 Q 248,245 256,310" />
    <path d="M 215,195 Q 185,240 195,285" stroke-width="6.5"/>
    <path d="M 297,195 Q 327,240 317,285" stroke-width="6.5"/>
    <path d="M 160,240 Q 150,265 170,285" stroke-width="5" opacity="0.85"/>
    <path d="M 352,240 Q 362,265 342,285" stroke-width="5" opacity="0.85"/>
  </g>

  <!-- Farinha de Trigo Polvilhada na Casca -->
  <ellipse cx="256" cy="195" rx="35" ry="12" fill="#ffffff" opacity="0.45"/>
  <circle cx="210" cy="225" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="302" cy="225" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="256" cy="245" r="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- Cruz Delicada no Topo -->
  <g transform="translate(256, 126)" stroke="url(#wheatGrad)" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="-24" x2="0" y2="24"/>
    <line x1="-15" y1="-8" x2="15" y2="-8"/>
    <circle cx="0" cy="-8" r="2.5" fill="#dfb775"/>
  </g>

  <!-- Tipografia Nobre Clean em Marrom Profundo -->
  <text x="256" y="396" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="800" fill="#3b2514" letter-spacing="6">PÃO DIVINO</text>
  <text x="256" y="426" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8c5825" letter-spacing="4">RECEITAS SAGRADAS</text>
  
  <!-- Linha Decorativa com Ponto em Trigo -->
  <line x1="160" y1="446" x2="235" y2="446" stroke="url(#wheatGrad)" stroke-width="1.5" opacity="0.45"/>
  <circle cx="256" cy="446" r="3.5" fill="url(#wheatGrad)"/>
  <line x1="277" y1="446" x2="352" y2="446" stroke="url(#wheatGrad)" stroke-width="1.5" opacity="0.45"/>
</svg>
