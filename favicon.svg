<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#241c14"/>
      <stop offset="60%" stop-color="#140f0b"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="35%" stop-color="#e5a93c"/>
      <stop offset="70%" stop-color="#c98218"/>
      <stop offset="100%" stop-color="#8a5309"/>
    </linearGradient>
    <linearGradient id="breadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e89838"/>
      <stop offset="40%" stop-color="#c4701e"/>
      <stop offset="85%" stop-color="#7a3e0c"/>
      <stop offset="100%" stop-color="#4d2406"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff2c9"/>
      <stop offset="100%" stop-color="#e5a93c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular com borda sagrada -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Aura de Luz Dourada -->
  <circle cx="256" cy="240" r="170" fill="#e5a93c" opacity="0.12" filter="url(#glow)"/>
  <circle cx="256" cy="240" r="130" fill="#ffe8a3" opacity="0.08"/>

  <!-- Moldura Fina Nobre -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="8 6"/>

  <!-- Raios Divinos Sutis -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.25" stroke-linecap="round">
    <line x1="256" y1="80" x2="256" y2="120"/>
    <line x1="150" y1="120" x2="175" y2="148"/>
    <line x1="362" y1="120" x2="337" y2="148"/>
    <line x1="100" y1="210" x2="140" y2="220"/>
    <line x1="412" y1="210" x2="372" y2="220"/>
  </g>

  <!-- Espiga de Trigo Esquerda -->
  <g transform="translate(140, 190) rotate(-28)" fill="url(#goldGrad)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="9" ry="22"/>
    <ellipse cx="-10" cy="25" rx="8" ry="18"/>
    <ellipse cx="10" cy="25" rx="8" ry="18"/>
    <ellipse cx="-12" cy="52" rx="7" ry="16"/>
    <ellipse cx="12" cy="52" rx="7" ry="16"/>
    <path d="M0,0 Q-5,60 0,95" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
  </g>

  <!-- Espiga de Trigo Direita -->
  <g transform="translate(372, 190) rotate(28)" fill="url(#goldGrad)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="9" ry="22"/>
    <ellipse cx="-10" cy="25" rx="8" ry="18"/>
    <ellipse cx="10" cy="25" rx="8" ry="18"/>
    <ellipse cx="-12" cy="52" rx="7" ry="16"/>
    <ellipse cx="12" cy="52" rx="7" ry="16"/>
    <path d="M0,0 Q5,60 0,95" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
  </g>

  <!-- Pão Rústico Artesanal Redondo (Boule Sagrado) -->
  <!-- Sombra do Pão -->
  <ellipse cx="256" cy="315" rx="145" ry="35" fill="#000000" opacity="0.6"/>

  <!-- Corpo do Pão -->
  <path d="M 125,295 C 120,210 185,160 256,160 C 327,160 392,210 387,295 C 385,325 330,335 256,335 C 182,335 127,325 125,295 Z" fill="url(#breadGrad)"/>

  <!-- Cortes Decorativos Tradicionais na Casca do Pão (Pontuação de Forno em Cruz Sagrada) -->
  <g stroke="url(#crustGrad)" stroke-width="9" stroke-linecap="round" opacity="0.95" filter="url(#glow)">
    <!-- Corte Curvo Central Vertical -->
    <path d="M 256,175 Q 248,245 256,310" />
    <!-- Cortes Laterais em Pétalas de Trigo -->
    <path d="M 215,195 Q 185,240 195,285" stroke-width="7"/>
    <path d="M 297,195 Q 327,240 317,285" stroke-width="7"/>
    <path d="M 160,240 Q 150,265 170,285" stroke-width="5" opacity="0.8"/>
    <path d="M 352,240 Q 362,265 342,285" stroke-width="5" opacity="0.8"/>
  </g>

  <!-- Farinha Polvilhada Rústica na Casca -->
  <ellipse cx="256" cy="195" rx="35" ry="12" fill="#fff5d9" opacity="0.4" filter="url(#glow)"/>
  <circle cx="210" cy="225" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="302" cy="225" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="256" cy="245" r="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- Cruz Luminosa no Topo do Pão -->
  <g transform="translate(256, 128)" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)">
    <line x1="0" y1="-26" x2="0" y2="26"/>
    <line x1="-16" y1="-10" x2="16" y2="-10"/>
    <circle cx="0" cy="-10" r="3" fill="#ffe8a3"/>
  </g>

  <!-- Texto Emblema Inferior -->
  <text x="256" y="398" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="34" font-weight="800" fill="url(#goldGrad)" letter-spacing="6">PÃO DIVINO</text>
  <text x="256" y="428" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#e5a93c" opacity="0.85" letter-spacing="4">RECEITAS SAGRADAS</text>
  
  <!-- Linha Decorativa Inferior com Ponto Dourado -->
  <line x1="160" y1="446" x2="235" y2="446" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="256" cy="446" r="3.5" fill="url(#goldGrad)"/>
  <line x1="277" y1="446" x2="352" y2="446" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
</svg>
